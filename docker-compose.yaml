version: '3.8'
services:
  # PHP 服務
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app
    container_name: laravel-app
    volumes:
      - .:/var/www
    networks:
      - laravel-network

  # Nginx 服務
  webserver:
    image: nginx:alpine
    container_name: laravel-webserver
    ports:
      - "8198:80"
    volumes:
      - .:/var/www
      - ./docker-config/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel-network

networks:
  laravel-network:
    driver: bridge